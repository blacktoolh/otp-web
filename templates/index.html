<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        
        h2 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .input-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 15px;
        }
        
        input::placeholder { color: rgba(255,255,255,0.4); }
        
        .captcha-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .captcha-label {
            background: rgba(255,255,255,0.2);
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,210,255,0.3); }
        
        .hidden { display: none; }
        
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
        }
        
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <a href="/logout" class="logout-btn">Logout</a>
    
    <div class="card">
        <h2>Account Recovery</h2>
        
        <div id="email-step">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>

            <div class="input-group">
                <label>Verification</label>
                <div class="captcha-box">
                    <span id="captcha-question" class="captcha-label">Loading...</span>
                    <input type="text" id="captcha-answer" placeholder="Answer">
                </div>
            </div>

            <button class="btn" onclick="sendOTP()">Send OTP</button>
        </div>

        <div id="otp-step" class="hidden">
            <div class="input-group">
                <label>Enter OTP</label>
                <input type="text" id="otp" placeholder="123456">
            </div>
            <button class="btn" onclick="verifyOTP()">Verify</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        async function loadCaptcha() {
            try {
                const res = await fetch('/get-captcha');
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('captcha-question').innerText = data.question;
                }
            } catch (e) {
                document.getElementById('captcha-question').innerText = "Error";
            }
        }

        async function sendOTP() {
            const email = document.getElementById('email').value.trim();
            const captcha = document.getElementById('captcha-answer').value.trim();
            const status = document.getElementById('status');
            const btn = document.querySelector('.btn');

            if(!email || !captcha) {
                status.innerText = "Fill all fields!";
                status.style.color = "#ff4d4d";
                return;
            }

            btn.classList.add('loading');
            status.innerText = "Sending...";
            status.style.color = "#fff";

            try {
                const res = await fetch('/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, captcha})
                });

                const data = await res.json();
                status.innerText = data.message;
                
                if(data.status === 'success') {
                    status.style.color = "#00ff88";
                    document.getElementById('email-step').classList.add('hidden');
                    document.getElementById('otp-step').classList.remove('hidden');
                } else {
                    status.style.color = "#ff4d4d";
                    loadCaptcha();
                    document.getElementById('captcha-answer').value = '';
                }
            } catch (e) {
                status.innerText = "Connection error!";
                status.style.color = "#ff4d4d";
            }
            
            btn.classList.remove('loading');
        }

        function verifyOTP() {
            const otp = document.getElementById('otp').value.trim();
            const status = document.getElementById('status');
            
            if(otp.length >= 4) {
                status.innerText = "OTP Verified: " + otp;
                status.style.color = "#00ff88";
            } else {
                status.innerText = "Enter valid OTP!";
                status.style.color = "#ff4d4d";
            }
        }

        window.onload = loadCaptcha;
    </script>
</body>
</html>
