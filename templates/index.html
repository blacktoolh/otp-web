<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body, html { height: 100%; overflow: hidden; }

        .video-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
        }
        .overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: -1;
        }
        .container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 35px 30px; width: 360px;
            color: #fff; text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .card h2 { font-size: 22px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #ddd; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2); color: #fff; outline: none;
        }
        .captcha-box {
            display: flex; gap: 10px; align-items: center;
        }
        .captcha-label {
            font-weight: bold; background: rgba(255, 255, 255, 0.2);
            padding: 10px; border-radius: 8px; font-size: 14px; white-space: nowrap;
        }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        #status { margin-top: 15px; font-size: 13px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop muted playsinline>
        <source src="{{ url_for('static', filename='video.mp4') }}" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="container">
        <div class="card">
            <h2>Account Recovery</h2>
            
            <div id="email-step">
                <div class="input-group">
                    <label>Gmail Address</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="input-group">
                    <label>Human Verification</label>
                    <div class="captcha-box">
                        <span id="captcha-question" class="captcha-label">Loading...</span>
                        <input type="text" id="captcha-answer" placeholder="Answer" required>
                    </div>
                </div>

                <button class="btn" onclick="sendOTP()">Send OTP</button>
            </div>

            <div id="otp-step" class="hidden">
                <div class="input-group">
                    <label>Enter OTP Code</label>
                    <input type="text" id="otp" placeholder="123456">
                </div>
                <button class="btn" onclick="verifyOTP()">Verify OTP</button>
            </div>

            <div id="status"></div>
        </div>
    </div>

    <script>
        async function loadCaptcha() {
            try {
                const res = await fetch('/get-captcha');
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('captcha-question').innerText = data.question;
                }
            } catch (e) {
                document.getElementById('captcha-question').innerText = "Error";
            }
        }

        async function sendOTP() {
            const email = document.getElementById('email').value.trim();
            const captcha = document.getElementById('captcha-answer').value.trim();
            const status = document.getElementById('status');

            if(!email || !captcha) {
                status.innerText = "Please fill in email and captcha!";
                status.style.color = "#ff4d4d";
                return;
            }

            status.innerText = "Sending request...";
            status.style.color = "#fff";

            try {
                const res = await fetch('/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, captcha: captcha})
                });

                const data = await res.json();
                if(data.status === 'success') {
                    status.innerText = data.message;
                    status.style.color = "#00ff88";
                    document.getElementById('email-step').classList.add('hidden');
                    document.getElementById('otp-step').classList.remove('hidden');
                } else {
                    status.innerText = data.message;
                    status.style.color = "#ff4d4d";
                    loadCaptcha();
                    document.getElementById('captcha-answer').value = '';
                }
            } catch (e) {
                status.innerText = "Connection error!";
                status.style.color = "#ff4d4d";
            }
        }

        function verifyOTP() {
            const otp = document.getElementById('otp').value.trim();
            const status = document.getElementById('status');
            if(otp) {
                status.innerText = "OTP Verified: " + otp;
                status.style.color = "#00ff88";
            } else {
                status.innerText = "Enter OTP first!";
                status.style.color = "#ff4d4d";
            }
        }

        window.onload = loadCaptcha;
    </script>
</body>
</html>
