<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            color: white;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        
        h2 {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #00d2ff, #92fe9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px;
        }
        
        .input-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255,255,255,0.85);
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(0,0,0,0.25);
            color: white;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #00d2ff;
        }
        
        input::placeholder { color: rgba(255,255,255,0.4); }
        
        .captcha-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .captcha-label {
            background: rgba(255,255,255,0.15);
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            white-space: nowrap;
            color: #00d2ff;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.4); 
        }
        
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }

        .status-success {
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .status-error {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff4d4d;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    
    <div class="card">
        <h2>Account Recovery</h2>
        
        <div id="email-step">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>

            <div class="input-group">
                <label>Verification</label>
                <div class="captcha-box">
                    <span id="captcha-question" class="captcha-label">Loading...</span>
                    <input type="text" id="captcha-answer" placeholder="Answer">
                </div>
            </div>

            <button class="btn" id="submit-btn" onclick="sendOTP()">Send Code</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        async function loadCaptcha() {
            try {
                const res = await fetch('/get-captcha');
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('captcha-question').innerText = data.question;
                }
            } catch (e) {
                document.getElementById('captcha-question').innerText = "Error";
            }
        }

        async function sendOTP() {
            const email = document.getElementById('email').value.trim();
            const captcha = document.getElementById('captcha-answer').value.trim();
            const status = document.getElementById('status');
            const btn = document.getElementById('submit-btn');

            if(!email || !captcha) {
                status.style.display = 'block';
                status.className = 'status-error';
                status.innerText = "সবগুলো ঘর পূরণ করুন!";
                return;
            }

            btn.classList.add('loading');
            status.style.display = 'block';
            status.className = '';
            status.style.color = '#fff';
            status.innerText = "পাঠানো হচ্ছে...";

            try {
                const res = await fetch('/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, captcha})
                });

                const data = await res.json();
                status.innerText = data.message;
                
                if(data.status === 'success') {
                    status.className = 'status-success';
                    document.getElementById('captcha-answer').value = '';
                } else {
                    status.className = 'status-error';
                    document.getElementById('captcha-answer').value = '';
                }

                if(data.new_question) {
                    document.getElementById('captcha-question').innerText = data.new_question;
                }
            } catch (e) {
                status.className = 'status-error';
                status.innerText = "সার্ভার কানেকশন এরর!";
            }
            
            btn.classList.remove('loading');
        }

        window.onload = loadCaptcha;
    </script>
</body>
</html>
